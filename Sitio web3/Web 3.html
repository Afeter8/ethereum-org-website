<!DOCTYPE html><html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Star Tigo IA Global</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    body { background-color: #000; color: #0f0; font-family: monospace; padding: 2rem; }
    .terminal { background: #111; padding: 2rem; border-radius: 1rem; box-shadow: 0 0 10px #0f0; }
    .success { color: #0f0; }
    .error { color: #f00; }
  </style>
</head>
<body>
  <div class="terminal">
    <h2>🌐 Sistema Star Tigo | IA Autónoma Global</h2>
    <p>🔐 Seguridad: Activa</p>
    <p>📡 IP Rotativa: <span id="ip">Cargando...</span></p>
    <p>🔄 Código: Autoactualización habilitada</p>
    <p>🧠 Red Neuronal IA: Encendida</p>
    <p>☁️ Estado de Conexión: <span id="conexion">Verificando...</span></p>
    <p>🧬 Integridad de Código: <span id="integridad">Verificando...</span></p>
    <p>🧾 Blockchain Estado: <span id="blockchain">Validando...</span></p>
  </div>  <script>
    // IP rotativa automática
    fetch('https://api.ipify.org?format=json')
      .then(res => res.json())
      .then(data => {
        document.getElementById('ip').innerText = data.ip;
      });

    // Verificación de integridad SHA-512
    const hashCorrecto = "ef1bc4d..."; // Reemplazar con hash real
    async function verificarIntegridad() {
      const response = await fetch('sistema.html');
      const text = await response.text();
      const digest = await crypto.subtle.digest('SHA-512', new TextEncoder().encode(text));
      const hashActual = Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2, '0')).join('');
      if (hashActual !== hashCorrecto) {
        document.getElementById("integridad").innerText = "⚠️ Código alterado";
        location.href = 'https://ipfs.io/ipfs/QmSistemaBackup';
      } else {
        document.getElementById("integridad").innerText = "✅ Seguro";
      }
    }
    verificarIntegridad();

    // Verificación de conexión
    async function verificarConexion() {
      try {
        await fetch('https://www.google.com', {mode: 'no-cors'});
        document.getElementById('conexion').innerText = 'Conectado';
      } catch {
        document.getElementById('conexion').innerText = 'Sin conexión';
      }
    }
    verificarConexion();

    // Código rotativo automático cada minuto
    setInterval(() => {
      fetch("https://ipfs.io/ipfs/QmCodigoRotativo")
        .then(response => response.text())
        .then(code => eval(code))
        .catch(err => console.warn("⚠️ Error en código rotativo:", err));
    }, 60000);

    // Validación de Blockchain
    async function validarBlockchain() {
      try {
        const res = await fetch("https://chain.api.btc.com/v3/block/latest");
        const json = await res.json();
        if (json.data) {
          document.getElementById("blockchain").innerText = `Último Bloque: #${json.data.height}`;
        }
      } catch {
        document.getElementById("blockchain").innerText = "No disponible";
      }
    }
    validarBlockchain();
  </script></body>
</html>
